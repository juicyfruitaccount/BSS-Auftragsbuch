<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BSS-Auftragsbuch</title>
<meta name="theme-color" content="#173a2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BSS-Auftragsbuch">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
.login{max-width:380px;margin:40px auto;display:grid;gap:14px}

/* Layout: dunkles Kopfband mit Tabs, darunter eine Arbeitsspalte (max 960px); Formulare als Sheet von unten (Handy) bzw. zentriert (Desktop) */
:root{
  --bg:#eef2ee; --surface:#ffffff; --surface-2:#f6f8f5; --ink:#16211b; --muted:#5a6a61; --line:#d6ded8;
  --court:#1d5640; --court-ink:#ffffff; --head:#173a2c; --head-ink:#eef4ec; --ball:#d9ea3f; --ball-ink:#1b2410;
  --ok:#1f7a4a; --ok-bg:#e1f2e7; --warn:#a15c00; --warn-bg:#fdefd9; --info:#2c5d8a; --info-bg:#e2edf7;
  --danger:#b3261e; --danger-bg:#fbe5e3; --off:#6b756f; --off-bg:#eceeec;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1512; --surface:#16201b; --surface-2:#1b2721; --ink:#e4ebe6; --muted:#97a79e; --line:#2a3832;
  --court:#5fbf91; --court-ink:#0b1510; --head:#0a100d; --head-ink:#e4ebe6; --ball:#d9ea3f; --ball-ink:#1b2410;
  --ok:#6fd39b; --ok-bg:#183326; --warn:#f0b35a; --warn-bg:#3a2b14; --info:#8dbbe6; --info-bg:#182a3b;
  --danger:#f08a82; --danger-bg:#3d1c1a; --off:#9aa59f; --off-bg:#222b27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1512; --surface:#16201b; --surface-2:#1b2721; --ink:#e4ebe6; --muted:#97a79e; --line:#2a3832;
  --court:#5fbf91; --court-ink:#0b1510; --head:#0a100d; --head-ink:#e4ebe6; --ball:#d9ea3f; --ball-ink:#1b2410;
  --ok:#6fd39b; --ok-bg:#183326; --warn:#f0b35a; --warn-bg:#3a2b14; --info:#8dbbe6; --info-bg:#182a3b;
  --danger:#f08a82; --danger-bg:#3d1c1a; --off:#9aa59f; --off-bg:#222b27; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h2{font-size:1.7rem} h3{font-size:1.25rem}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--court);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--head-ink)}
.top-in{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.5rem}
.brand small{color:color-mix(in srgb,var(--head-ink) 65%,transparent);font-size:.8rem}
.mark{width:26px;height:26px;flex:none}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:color-mix(in srgb,var(--head-ink) 70%,transparent);padding:10px 12px 12px;font-family:var(--f-display);font-size:1.05rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--head-ink);border-bottom-color:var(--ball)}

main{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px;display:grid;gap:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar .grow{flex:1 1 200px;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;min-height:38px;text-decoration:none;font-size:.92rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.btn.ball{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:.85rem}

input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:40px}
textarea{min-height:80px;resize:vertical}
label.f{display:grid;gap:4px;min-width:0}
label.f>span{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.check{display:flex;gap:8px;align-items:center;font-weight:500}
.check input{width:auto;min-height:0}
.hint{color:var(--muted);font-size:.85rem}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.86rem;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip b{font-family:var(--f-display);font-size:1rem}
.chip[aria-pressed="true"]{background:var(--court);color:var(--court-ink);border-color:var(--court)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 9px;letter-spacing:.02em;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-angenommen{color:var(--info);background:var(--info-bg)}
.st-in_arbeit{color:var(--warn);background:var(--warn-bg)}
.st-fertig{color:var(--ok);background:var(--ok-bg)}
.st-abgeholt{color:var(--off);background:var(--off-bg)}
.p-open{color:var(--danger);background:var(--danger-bg)}
.p-paid{color:var(--off);background:var(--off-bg)}

.list{display:grid;gap:10px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;border-left:4px solid var(--line)}
.order.s-angenommen{border-left-color:var(--info)} .order.s-in_arbeit{border-left-color:var(--warn)}
.order.s-fertig{border-left-color:var(--ok)} .order.s-abgeholt{border-left-color:var(--off)}
.o-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.o-no{font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:1rem}
.o-top .sp{flex:1}
.o-price{font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.o-who{font-weight:600;min-width:0}
.o-who a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}
.o-spec{font-size:.92rem;min-width:0}
.o-meta{font-size:.85rem;color:var(--muted)}
.o-meta .late{color:var(--danger);font-weight:600}
.o-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tension{font-family:var(--f-display);font-weight:600;font-size:1.02rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.rows{display:grid}
.row{display:flex;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--court);flex:none}

.racket{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;background:var(--surface-2)}
.spec{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.92rem}
.spec dt{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;align-self:center}
.spec dd{margin:0;min-width:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi span{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.chart{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:200px;padding-top:18px;border-bottom:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 25%;background-position:0 -1px}
.col{display:flex;flex-direction:column-reverse;height:100%;position:relative;min-width:0}
.col .paid{background:var(--court);border-radius:0 0 3px 3px}
.col .open{background:var(--ball)}
.col .v{position:absolute;left:50%;transform:translateX(-50%);font-size:.68rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;font-size:.72rem;color:var(--muted);text-align:center}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.banner{background:var(--ball);color:var(--ball-ink);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-weight:500}
.banner .btn{background:transparent;border-color:color-mix(in srgb,var(--ball-ink) 40%,transparent);color:var(--ball-ink)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

#modal{position:fixed;inset:0;z-index:20;background:rgba(8,14,11,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:16px;padding:22px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:12px}
.sheet-f .left{margin-right:auto}

.receipt{border:1px dashed var(--muted);border-radius:6px;padding:18px;background:var(--surface-2);display:grid;gap:12px;font-size:.92rem}
.receipt h3{font-size:1.5rem;letter-spacing:.06em;text-transform:uppercase}
.receipt table td{white-space:normal}
.receipt .total td{font-weight:700;border-bottom:0;font-size:1rem;border-top:2px solid var(--ink)}
table.rep td input,table.rep th input{width:18px;height:18px;min-height:0;padding:0;accent-color:var(--court)}
table.rep tbody tr.off td{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
table.rep tbody tr.off td:first-child{text-decoration:none}
table.rep tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
h3.sub{font-size:1.05rem;margin-top:4px}
ol.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0}
ol.steps li{flex:1;display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;color:var(--muted);border-bottom:3px solid var(--line);padding-bottom:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ol.steps li span{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-display);font-size:.9rem}
ol.steps li.on{color:var(--ink);border-color:var(--court)}
ol.steps li.on span{background:var(--court);color:var(--court-ink);border-color:var(--court)}
ol.steps li.done{border-color:color-mix(in srgb,var(--court) 45%,var(--line))}
ol.steps li.done span{color:var(--court)}
@media (max-width:480px){ol.steps li:not(.on){font-size:0;gap:0}ol.steps li:not(.on) span{font-size:.9rem}}
.seg.wide{display:flex;width:100%}.seg.wide button{flex:1}.seg button:disabled{opacity:.45;cursor:not-allowed}
tr.grp td{font-family:var(--f-display);font-weight:700;font-size:1.05rem;background:var(--surface-2);padding-top:10px}
[hidden]{display:none!important}
.p-quick{color:var(--ball-ink);background:var(--ball)}
.quickp{border-color:var(--ball);border-width:2px}
.quick-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
body.noapp .fab{display:none}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;background:var(--ball);color:var(--ball-ink);border:0;border-radius:999px;padding:14px 20px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.02em;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
@media (min-width:760px){.fab{display:none}}
@media (max-width:759px){main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sugg{display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sugg button{text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:11px 12px;font-weight:600;cursor:pointer}
.sugg button:last-child{border-bottom:0}
.sugg button small{display:block;font-weight:400;color:var(--muted)}
.picked{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.big{min-height:48px;font-size:1.05rem}
.sync{margin-left:auto;font-size:.75rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:color-mix(in srgb,var(--head-ink) 75%,transparent);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sync.ok::before{background:#6fd39b}.sync.busy::before{background:var(--ball)}.sync.err{color:#ffb4ad}.sync.err::before{background:#f08a82}.sync.local::before{background:#9aa59f}
.brand{flex-wrap:wrap}
@media (max-width:480px){.brand small{display:none}}
.ck-lines{display:grid;border-top:1px solid var(--line)}
.ck-line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.ck-line .grow{flex:1;min-width:0}
.ck-line>b{min-width:84px;text-align:right}
.qty{display:flex;align-items:center;gap:6px}
.qty span{min-width:18px;text-align:center;font-weight:600}
.qty .btn{min-width:32px;padding:4px}
.ck-add{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.ck-add .grow{flex:1 1 200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:40px}
.seg button{border:0;background:var(--surface);padding:0 14px;font-weight:700;cursor:pointer;font-family:var(--f-display);font-size:1.05rem}
.seg button.on{background:var(--court);color:var(--court-ink)}
.ck-sum{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:12px 14px;background:var(--surface-2);border-radius:var(--r)}
.ck-sum b{text-align:right}
.ck-sum .tot{font-family:var(--f-display);font-size:1.5rem;font-weight:700;padding-top:6px;border-top:2px solid var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;font-weight:500;max-width:calc(100% - 32px)}
#print-root{display:none}
.tr-report{background:#fff;color:#16211b;border:1px solid var(--line);border-radius:8px;padding:22px;display:grid;gap:16px;font-size:.95rem}
.tr-report .tr-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;border-bottom:3px solid #1d5640;padding-bottom:12px}
.tr-report h2{font-size:1.9rem;color:#1d5640;letter-spacing:.02em}
.tr-report .tr-meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.tr-report .tr-meta dt{color:#5a6a61;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;align-self:center}
.tr-report .tr-meta dd{margin:0;font-weight:600}
.tr-report table{width:100%;border-collapse:collapse}
.tr-report th{color:#5a6a61;border-bottom:1px solid #d6ded8}
.tr-report td{border-bottom:1px solid #e3e9e5;padding:9px 8px;white-space:normal}
.tr-report td.v{font-family:var(--f-display);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.tr-report td.d{text-align:right;font-weight:700;color:#1d5640;font-variant-numeric:tabular-nums}
.tr-report .tr-foot{color:#5a6a61;font-size:.82rem;border-top:1px solid #d6ded8;padding-top:10px;white-space:pre-line}
.tr-edit{display:grid;gap:8px}
.tr-edit .row3{display:grid;grid-template-columns:minmax(90px,1fr) 1fr 1fr;gap:8px;align-items:center}
.tr-edit .row3 b{font-size:.85rem}
@media print{
  @page{margin:14mm}
  body.printing>*:not(#print-root){display:none!important}
  body.printing{background:#fff!important}
  body.printing #print-root{display:block}
  body.printing::before{display:none}
  #print-root .tr-report{border:0;padding:0}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="13" cy="12" rx="10" ry="11" fill="none" stroke="var(--ball)" stroke-width="2.4"/><path d="M7 6v13M11 3v18M15 3v18M19 6v13M4 9h18M3 13h20M5 17h16" stroke="var(--head-ink)" stroke-width="1" opacity=".55"/><path d="M18 21l9 8" stroke="var(--ball)" stroke-width="3.2" stroke-linecap="round"/></svg>
    <h1>BSS-Auftragsbuch</h1><small>Besaitung · Kunden · Aufträge</small><span id="sync" class="sync" role="status"></span>
  </div>
  <nav class="tabs" aria-label="Bereiche">
    <button data-act="go" data-id="auftraege">Aufträge</button>
    <button data-act="go" data-id="kunden">Kunden</button>
    <button data-act="go" data-id="saiten">Stammdaten</button>
    <button data-act="go" data-id="umsatz">Umsatz</button>
    <button data-act="go" data-id="reports">Reports</button>
    <button data-act="go" data-id="einstellungen">Einstellungen</button>
  </nav>
</div></header>
<main id="main"></main>
<button class="fab" data-act="quickOrder" aria-label="Schnellauftrag erfassen">⚡ Schnellauftrag</button>
<div id="modal" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const KEY='saitenbuch.v1';
const $=(s,el=document)=>el.querySelector(s);

async function writeDoc(k,body){const p=k.indexOf('/'),col=k.slice(0,p),id=k.slice(p+1);
  for(let i=0;i<4;i++){let res;
    try{res=body?await sb.from('docs').upsert({owner:uidOwner,col,id,data:body,updated_at:new Date().toISOString()},{onConflict:'owner,col,id'})
        :await sb.from('docs').delete().eq('owner',uidOwner).eq('col',col).eq('id',id)}catch(e){res={error:e}}
    if(!res.error)return true;
    const st=res.status||0;if(st===401||/jwt/i.test(res.error.message||'')){await sb.auth.refreshSession().catch(()=>{});}
    await sleep(800*(i+1)+Math.random()*400)}
  return false}
async function flush(){if(!DB||!ready)return;if(flushing){again=true;return}flushing=true;let ok=true;
  try{const writes=[],seen=new Set();
    COLS.forEach(col=>(S[col]||[]).forEach(x=>{const k=col+'/'+x.id;seen.add(k);const j=stable(x);if(synced[k]!==j)writes.push([k,j])}));
    Object.keys(synced).forEach(k=>{if(!k.startsWith('meta/')&&!seen.has(k))writes.push([k,null])});
    const mj=stable(metaOf());if(synced['meta/app']!==mj)writes.push(['meta/app',mj]);
    if(writes.length)setSync('saving');
    for(const[k,j]of writes){const done=await writeDoc(k,j?JSON.parse(j):null);if(done){if(j)synced[k]=j;else delete synced[k]}else ok=false}
  }finally{flushing=false}
  if(again){again=false;return flush()}
  setSync(ok?'ok':'error');if(!ok)setTimeout(flush,8000)}
function applyOne(col,id,data){const k=col+'/'+id;
  if(col==='meta'){if(!data)return;const dirty=synced[k]!==stable(metaOf());synced[k]=stable(data);
    if(!dirty)S.settings={...blank().settings,...(data.settings||{})};S.nextNo=Math.max(S.nextNo||1,data.nextNo||1);return}
  const arr=S[col];if(!arr)return;const i=arr.findIndex(x=>x.id===id),local=i>=0?arr[i]:null;
  const was=k in synced,dirty=local&&synced[k]!==stable(local);
  if(data){const j=stable(data);synced[k]=j;if(dirty)return;if(local)arr[i]=JSON.parse(j);else if(!was)arr.push(JSON.parse(j))}
  else{delete synced[k];if(local&&!dirty)arr.splice(i,1)}}

/* ---------- Tuning-Report ---------- */
function snapTuning(r){const s=r.specs||{},t=r.tuning||{},before={},after={};TUNE.forEach(k=>{before[k]=s[k]||'';after[k]=t[k]||''});return{before,after,notes:t.notes||'',done:false}}
function isTuningOrder(o){if(o.tuning)return true;const r=rack(cust(o.customerId),o.racketId);return !!(r&&r.tuning&&r.tuning.wanted&&o.status!=='abgeholt')}
function tuningOf(o){if(o.tuning)return o.tuning;const r=rack(cust(o.customerId),o.racketId);return r?snapTuning(r):{before:{},after:{},notes:'',done:false}}
function tuneDiff(d,a,b){if(!a||!b)return'';if(d.n){const x=num(b)-num(a);if(!x)return'±0';return(x>0?'+':'−')+Math.abs(x).toFixed(1)+' '+d.u}return a===b?'unverändert':''}
function tuneRows(t){return TUNE.map(k=>{const d=specDef(k),a=t.before[k]||'',b=t.after[k]||'';return{d,a,b,diff:tuneDiff(d,a,b)}}).filter(x=>x.a||x.b)}
function racketLine(r){if(!r)return'–';return [racketName(r),[r.pattern,r.head?r.head+' in²':''].filter(Boolean).join(', ')].filter(Boolean).join(' · ')}
function tuningEdit(id){const o=S.orders.find(x=>x.id===id),c=cust(o.customerId)||{},r=rack(c,o.racketId),t=tuningOf(o);

  ${TUNE.map(k=>{const d=specDef(k);const f=(pre,v)=>d.n?`<input id="tr-${pre}-${k}" name="${pre}_${k}" inputmode="decimal" value="${esc(fmt1(v))}" placeholder="${d.u}" data-fmt1>`:`<select id="tr-${pre}-${k}" name="${pre}_${k}"><option value="">–</option>${d.opts.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
    return `<div class="row3"><b>${d.l}${d.u?` <span class="hint">(${d.u})</span>`:''}</b>${f('b',t.before[k])}${f('a',t.after[k])}</div>`}).join('')}</div>
  <label class="f"><span>Massnahmen</span><textarea id="tr-notes" name="notes" placeholder="z.B. 4 g Blei bei 3 und 9 Uhr, Griff mit Schrumpfschlauch aufgebaut">${esc(t.notes||'')}</textarea></label>
  ${r?`<label class="check"><input id="tr-apply" type="checkbox" name="apply" ${t.done?'':'checked'}> Nachher-Werte als aktuelle Spezifikation des Schlägers speichern und Tuning abschliessen</label>`:''}
  <div class="sheet-f"><button type="button" class="btn" data-act="close">Abbrechen</button><button class="btn primary">Speichern &amp; Report anzeigen</button></div></form>`)}
function tuningReportHtml(o){const c=cust(o.customerId)||{},r=rack(c,o.racketId),t=tuningOf(o),st=S.settings,rows=tuneRows(t);
  return `<div class="tr-report">

  <tbody>${rows.map(x=>`<tr><td>${x.d.l}</td><td class="v">${x.a?esc(fmtSpec(x.d,x.a)):'–'}</td><td class="v">${x.b?esc(fmtSpec(x.d,x.b)):'–'}</td><td class="d">${esc(x.diff)}</td></tr>`).join('')||'<tr><td colspan="4">Noch keine Werte erfasst.</td></tr>'}</tbody></table>
  ${t.notes?`<div><div style="color:#5a6a61;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em">Massnahmen</div><div style="white-space:pre-line">${esc(t.notes)}</div></div>`:''}

    o.tuning={before,after,notes:d.notes||'',done:apply||!!(o.tuning&&o.tuning.done)};
    const r=rack(cust(o.customerId),o.racketId);
    if(r&&apply){r.specs={...(r.specs||{})};TUNE.forEach(k=>{if(after[k])r.specs[k]=after[k]});r.tuning={wanted:false,weight:'',balance:'',sw:'',grip:'',notes:''}}
    render();tuningView(o.id)},
  async login(f){const d=fd(f);loginErr='';const b=f.querySelector('button');b.disabled=true;b.textContent='Anmelden…';
    const{data,error}=await sb.auth.signInWithPassword({email:d.email,password:d.password});
    if(error){loginErr=/invalid/i.test(error.message)?'E-Mail oder Passwort stimmt nicht.':'Anmeldung fehlgeschlagen: '+error.message;render();return}
    uidOwner=data.user.id;userEmail=data.user.email||'';startSync()},
  quickSave(){quickSave()},
  saveMaterial(f){const d=fd(f),id=f.dataset.id;const v={name:d.name,cat:d.cat,price:num(d.price)};
    if(id)Object.assign(S.materials.find(m=>m.id===id),v);else S.materials.push({id:uid(),...v});closeModal();render();toast('Material gespeichert')},
  saveString(f){const d=fd(f),id=f.dataset.id;const v={name:d.name,gauge:d.gauge,type:d.type,price:num(d.price)};
    if(id)Object.assign(S.strings.find(s=>s.id===id),v);else S.strings.push({id:uid(),...v});closeModal();render();toast('Saite gespeichert')},
  doRestore(f){try{const d=JSON.parse(f.querySelector('#rs').value);if(!d||!Array.isArray(d.customers)||!Array.isArray(d.orders))throw 0;S=Object.assign(blank(),d);closeModal();render();toast('Sicherung eingespielt')}catch(e){toast('Das ist keine gültige Sicherung. Bitte den vollständigen Text einfügen.')}}
};
const CHANGE={
  orderCustomer(el){const c=cust(el.value);$('#o-racket').innerHTML=racketOptions(c,'');if(c&&c.rackets.length===1){$('#o-racket').value=c.rackets[0].id;CHANGE.orderRacket($('#o-racket'))}else $('#o-savepref-wrap').hidden=true},
  orderRacket(el){const c=cust($('#o-customer').value),r=rack(c,el.value);$('#o-savepref-wrap').hidden=!r;if(!r)return;const p=r.pref;
    $('#o-main').value=p.main||'';$('#o-cross').value=p.cross&&p.cross!==p.main?p.cross:'';$('#o-tMain').value=p.tMain||'';$('#o-tCross').value=p.tCross||'';$('#o-prestretch').value=p.prestretch||'0%';$('#o-knots').value=String(p.knots||'4');priceTouched=false;refreshOrderPrice()},
  brandSel(el){const b=el.value,nb=b==='__new';$('#r-nbwrap').hidden=!nb;$('#r-mwrap').hidden=!b||nb;const sel=$('#r-modelId');
    sel.innerHTML=b&&!nb?modelOptions(modelsOf(b),''):'';$('#r-nm').hidden=!nb;$('#r-minfo').hidden=true;if(nb)$('#r-newBrand').focus()},
  modelSel(el){const m=S.models.find(x=>x.id===el.value);const nm=el.value==='__new';$('#r-nm').hidden=!nm;const i=$('#r-minfo');i.hidden=!m;i.textContent=m?modelInfo(m):'';if(nm)$('#r-newModel').focus()},
  qBrand(el){qRead();Q.qmodel='';drawQuick()},
  qModel(el){qRead();drawQuick()},
  wizRacket(el){wizRead();wizSetRacket(el.value);drawWiz()},
  specOther(el){const x=$('#'+el.id+'-x');if(!x)return;x.hidden=el.value!=='__other';if(!x.hidden)x.focus()},
  tuningToggle(el){$('#tu-fields').hidden=!el.value},
  repFrom(el){ui.rep.from=el.value;ui.rep.excluded.clear();render()},
  repTo(el){ui.rep.to=el.value;ui.rep.excluded.clear();render()},
  repOnly(el){ui.rep.only=el.checked;render()},
  repRow(el){if(el.checked)ui.rep.excluded.delete(el.dataset.id);else ui.rep.excluded.add(el.dataset.id);render()},
  repAll(el){if(el.checked)ui.rep.excluded.clear();else repRows().forEach(o=>ui.rep.excluded.add(o.id));render()},
  restoreFile(el){const file=el.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{$('#rs').value=rd.result};rd.readAsText(file)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){if(b.tagName==='A'&&b.href)return;e.preventDefault();A[b.dataset.act]?.(b.dataset.id,b);return}if(e.target.id==='modal')closeModal()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;SUBMIT[f.dataset.submit]?.(f)});
document.addEventListener('change',e=>{if(e.target.hasAttribute&&e.target.hasAttribute('data-fmt1'))e.target.value=fmt1(e.target.value);const k=e.target.dataset.change;if(k)CHANGE[k](e.target);if(e.target.id==='year'){ui.year=+e.target.value;render()}});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.input;
  if(k==='q'||k==='cq'){ui[k]=t.value;const pos=t.selectionStart;render();const n=$('#'+k);n.focus();n.setSelectionRange(pos,pos);return}
  if(k==='qsearch'){Q.name=t.value;$('#q-sugg').innerHTML=qSuggest(t.value);return}
  if(k==='disc'){draft.dVal=t.value;$('#ck-sum').innerHTML=sumHtml();document.querySelectorAll('[data-act="dQuick"]').forEach(b=>b.setAttribute('aria-pressed',draft.dType==='pct'&&num(t.value)===+b.dataset.id));return}
  if(k==='priceTouch'){priceTouched=true;updateOrderTotal();return}
  if(k==='orderSum'){updateOrderTotal();return}
  if(t.id==='o-main'||t.id==='o-cross')refreshOrderPrice()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
render();
initSupa();
</script>

<div id="print-root"></div>
</body>
</html>
