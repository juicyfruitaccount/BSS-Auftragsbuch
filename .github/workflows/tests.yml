name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Playwright 1.56 unterstützt Ubuntu 24.04, aber noch nicht 26.04
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
